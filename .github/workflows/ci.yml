name: CI

on:
  # A pull request is checked once per commit, through its pull_request run; a push run of the same
  # commit would repeat every job. Label changes start no run here: the one check a label affects, the
  # changelog entry, lives in changelog.yml. Pushes to main still run, so main's own state is checked.
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  # Lets a maintainer run the checks on any branch or commit by hand.
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

# Every job runs on the maintainer's own runners. Every check is a step named for what it checks, and
# the work lives in .github/checks, which is what the local gate and a contributor run too. The last
# job, gate, passes only when every other job passed; branch protection requires it and the changelog
# job in changelog.yml.
jobs:
  go-checks:
    name: Go checks
    runs-on: [self-hosted, linux, arm64, vayaan]
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # The checks share one checkout and one Go setup and run side by side; each reports under its
      # own name, and a red one fails the job.
      - parallel:
          - name: Go formatting
            run: bash .github/checks/go-format.sh

          - name: Go vet
            run: bash .github/checks/go-vet.sh

          - name: Go tests
            run: bash .github/checks/go-test.sh

          - name: Go build
            run: bash .github/checks/go-build.sh

  swift-test:
    name: Swift tests
    # The app ships from the macOS 27 SDK, and its code uses APIs that only that SDK has.
    runs-on: [self-hosted, macos, arm64, vayaan]
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: show toolchain
        run: |
          xcodebuild -version
          xcrun --show-sdk-version

      - name: swift test
        run: bash .github/checks/swift-test.sh

  mac-app-build:
    name: Mac app build
    # The app ships from the macOS 27 SDK, and its code uses APIs that only that SDK has.
    runs-on: [self-hosted, macos, arm64, vayaan]
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # A self-hosted Mac keeps its own warm module cache; restoring the Actions cache over it
          # only downloads and re-uploads hundreds of megabytes.
          cache: ${{ runner.environment == 'github-hosted' }}

      - name: show toolchain
        run: |
          xcodebuild -version
          xcrun --show-sdk-version

      - name: install xcodegen
        run: command -v xcodegen >/dev/null || brew install xcodegen

      - name: build app (unsigned)
        run: bash .github/checks/mac-app-build.sh

  gate:
    name: gate
    if: always()
    needs:
      - go-checks
      - swift-test
      - mac-app-build
    runs-on: [self-hosted, linux, arm64, vayaan]
    permissions: {}
    steps:
      - name: every check passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          total="$(jq -e 'if type == "object" and length > 0 then length else empty end' <<< "$NEEDS" 2>/dev/null)" || total=0
          case "$total" in
            '' | *[!0-9]* | 0)
              echo "::error::gate received no results to check"
              exit 1
              ;;
          esac
          bad="$(jq -r 'to_entries[] | select(.value.result != "success") | "\(.key) \(.value.result)"' <<< "$NEEDS")"
          {
            echo "| Check | Result |"
            echo "| --- | --- |"
            jq -r 'to_entries[] | "| \(.key) | \(.value.result) |"' <<< "$NEEDS"
          } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
          if [ -n "$bad" ]; then
            count=0
            while read -r id result; do
              echo "::error::${id} did not pass (${result})"
              count=$((count + 1))
            done <<< "$bad"
            echo "gate failed: ${count} of ${total} checks did not pass"
            exit 1
          fi
          echo "All ${total} checks passed."
