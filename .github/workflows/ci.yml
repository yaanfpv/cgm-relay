name: CI

on:
  # A pull request is checked once, through its pull_request run; a push run of the same commit would
  # repeat every job. Pushes to main still run, so main's own state is always checked.
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  # Lets a maintainer run the checks on any branch or commit by hand.
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

# Every check is a step named for what it checks, and the work lives in .github/checks, which is what
# the local gate and a contributor run too. The last job, gate, passes only when every other job
# passed, so branch protection requires that one job.
jobs:
  go-checks:
    name: Go checks
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The changelog entry compares the pull request's base and head.
          fetch-depth: 0
          persist-credentials: false

      - name: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # The checks share one checkout and one Go setup and run side by side; each reports under its
      # own name, and a red one fails the job.
      - parallel:
          - name: Go formatting
            run: bash .github/checks/go-format.sh

          - name: Go vet
            run: bash .github/checks/go-vet.sh

          - name: Go tests
            run: bash .github/checks/go-test.sh

          - name: Go build
            run: bash .github/checks/go-build.sh

          # Never skipped: the step itself decides whether an entry is owed and always says which.
          - name: Changelog entry
            env:
              EVENT_NAME: ${{ github.event_name }}
              WAIVED: ${{ contains(github.event.pull_request.labels.*.name, 'no changelog') }}
              BASE_SHA: ${{ github.event.pull_request.base.sha }}
              HEAD_SHA: ${{ github.event.pull_request.head.sha }}
            run: |
              if [ "$EVENT_NAME" != pull_request ]; then
                echo "The changelog entry applies to pull requests only; nothing to check on this ${EVENT_NAME}."
              elif [ "$WAIVED" = true ]; then
                echo "The \`no changelog\` label waives the changelog entry for this pull request."
              else
                bash .github/checks/changelog-entry.sh
              fi

  swift-test:
    name: Swift tests
    # The app ships from the macOS 27 SDK, and its code uses APIs that only that SDK has.
    runs-on: xcode-27
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: show toolchain
        run: |
          xcodebuild -version
          xcrun --show-sdk-version

      - name: swift test
        run: bash .github/checks/swift-test.sh

  mac-app-build:
    name: Mac app build
    # The app ships from the macOS 27 SDK, and its code uses APIs that only that SDK has.
    runs-on: xcode-27
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: show toolchain
        run: |
          xcodebuild -version
          xcrun --show-sdk-version

      - name: install xcodegen
        run: command -v xcodegen >/dev/null || brew install xcodegen

      - name: build app (unsigned)
        run: bash .github/checks/mac-app-build.sh

  gate:
    name: gate
    if: always()
    needs:
      - go-checks
      - swift-test
      - mac-app-build
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: every check passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          total="$(jq -e 'if type == "object" and length > 0 then length else empty end' <<< "$NEEDS" 2>/dev/null)" || total=0
          case "$total" in
            '' | *[!0-9]* | 0)
              echo "::error::gate received no results to check"
              exit 1
              ;;
          esac
          bad="$(jq -r 'to_entries[] | select(.value.result != "success") | "\(.key) \(.value.result)"' <<< "$NEEDS")"
          {
            echo "| Check | Result |"
            echo "| --- | --- |"
            jq -r 'to_entries[] | "| \(.key) | \(.value.result) |"' <<< "$NEEDS"
          } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
          if [ -n "$bad" ]; then
            count=0
            while read -r id result; do
              echo "::error::${id} did not pass (${result})"
              count=$((count + 1))
            done <<< "$bad"
            echo "gate failed: ${count} of ${total} checks did not pass"
            exit 1
          fi
          echo "All ${total} checks passed."
