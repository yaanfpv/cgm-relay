name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash

# One job per check, each named for what it checks. The work lives in .github/checks, which is what
# the local gate and a contributor run too.
jobs:
  go-format:
    name: Go formatting
    runs-on: [self-hosted, linux, arm64, vayaan]
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: check formatting
        run: bash .github/checks/go-format.sh

  go-vet:
    name: Go vet
    runs-on: [self-hosted, linux, arm64, vayaan]
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: vet
        run: bash .github/checks/go-vet.sh

  go-test:
    name: Go tests
    runs-on: [self-hosted, linux, arm64, vayaan]
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: test
        run: bash .github/checks/go-test.sh

  go-build:
    name: Go build
    runs-on: [self-hosted, linux, arm64, vayaan]
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: build
        run: bash .github/checks/go-build.sh

  swift-test:
    name: Swift tests
    # The app ships from the macOS 27 SDK, and its code uses APIs that only that SDK has.
    runs-on: [self-hosted, macos, arm64, vayaan]
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: show toolchain
        run: |
          xcodebuild -version
          xcrun --show-sdk-version

      - name: swift test
        run: bash .github/checks/swift-test.sh

  mac-app-build:
    name: Mac app build
    # The app ships from the macOS 27 SDK, and its code uses APIs that only that SDK has.
    runs-on: [self-hosted, macos, arm64, vayaan]
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: show toolchain
        run: |
          xcodebuild -version
          xcrun --show-sdk-version

      - name: install xcodegen
        run: brew install xcodegen

      - name: build app (unsigned)
        run: bash .github/checks/mac-app-build.sh
